[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "LightconeGen"
version = "0.1.0"
description = "Periodic-box masked lightcone geometry and observer placement"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "astropy", "healpy"]

[project.optional-dependencies]
plots = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
